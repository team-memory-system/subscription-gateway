<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구독 게이트웨이</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <header>
    <h1>구독 게이트웨이</h1>
    <p class="muted">구독 계정을 OpenAI 형식 주소로 바꿔 한 곳으로 모읍니다. 이 화면은 이 컴퓨터에서만 열립니다.</p>
    <p class="muted mono" id="app-home"></p>
  </header>

  <section>
    <h2>1. 로그인</h2>
    <p class="muted">이 게이트웨이는 자기 자격증명을 따로 씁니다. 여기서 로그인해도 터미널에서 쓰는 <span class="mono">codex</span>·<span class="mono">claude</span> 로그인은 건드리지 않습니다.</p>
    <div id="logins" class="rows"></div>
  </section>

  <section>
    <h2>2. 서비스</h2>
    <p class="muted">재부팅하면 다시 시작해야 합니다. 등록되는 것은 없습니다.</p>
    <div id="services" class="rows"></div>
  </section>

  <section>
    <h2>3. 라우터가 보는 모델</h2>
    <div id="models" class="models"></div>
  </section>

  <section>
    <h2>4. 대화 시험</h2>
    <p class="muted">라우터로 보냅니다. 어느 백엔드로 갈지는 고른 모델 이름이 정합니다.</p>
    <form id="chat-form">
      <label for="chat-model">모델</label>
      <select id="chat-model" name="model" required></select>
      <label for="chat-prompt">보낼 말</label>
      <textarea id="chat-prompt" name="prompt" rows="3" required placeholder="한 문장으로 자기소개 해줘"></textarea>
      <button type="submit" class="primary" id="chat-send">보내기</button>
    </form>
    <div id="chat-result" class="result" hidden></div>
  </section>

  <p id="notice" class="notice" hidden></p>
</main>
<script src="app.js"></script>
</body>
</html>
